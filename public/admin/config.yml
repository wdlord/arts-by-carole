
backend:
  name: github
  repo: wdlord/arts-by-carole
  branch: main
  base_url: https://decap-cms-proxy.vercel.app/
  auth_endpoint: auth

# local_backend: true

media_folder: "/src/assets/images" # Location where files will be stored in the repo
public_folder: "/src/assets/images" # The src attribute for uploaded media

collections:
  # artwork
  - name: "artwork"
    label: "Artwork"
    folder: "/src/content/artwork"
    media_folder: "/src/images/gallery/artwork"
    public_folder: "/src/images/gallery/artwork"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields: &artwork_fields
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Size", name: "size", widget: "string", required: false }
      - { label: "Medium", name: "medium", widget: "string", required: false }
      - label: "Categories"
        name: "categories"
        widget: "list"
        default: []
        required: false
      - { label: "Available", name: "available", widget: "boolean", default: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - label: "Image"
        name: "image"
        widget: "image"
      - { label: "Description", name: "description", widget: "text", required: false }
  
  # ephemera
  - name: "ephemera"
    label: "Ephemera"
    folder: "/src/content/ephemera"
    media_folder: "/src/images/gallery/ephemera"
    public_folder: "/src/images/gallery/ephemera"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields: &ephemera_fields
      - { label: "Title", name: "title", widget: "string" }
      - label: "Categories"
        name: "categories"
        widget: "list"
        default: []
        required: false
      - { label: "Available", name: "available", widget: "boolean", default: false }
      - label: "Image"
        name: "image"
        widget: "image"
      - { label: "Description", name: "description", widget: "text", required: false }

  # autograph
  - name: "autograph"
    label: "Autographs"
    folder: "/src/content/autographs"
    media_folder: "/src/images/gallery/autographs"
    public_folder: "/src/images/gallery/autographs"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields: &autograph_fields
      - { label: "Title", name: "title", widget: "string" }
      - label: "Categories"
        name: "categories"
        widget: "list"
        default: []
        required: false
      - label: "Image"
        name: "image"
        widget: "image"
      - { label: "Description", name: "description", widget: "text", required: false }
  
  # past exhibits
  - name: "past_exhibits"
    label: "Past Exhibits"
    files:
      - name: "exhibits"
        label: "Past Exhibits List"
        file: "src/content/past-exhibits/exhibits.json"
        fields:
          - label: "Exhibits"
            name: "exhibits"
            widget: "list"
            label_singular: "Exhibit"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text", required: false }

